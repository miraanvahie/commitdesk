<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CommitDesk</title>
  <meta name="description" content="Turn verbally assigned meeting work into structured tasks.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f8cff'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">✓</span>
      <span class="brand-name">CommitDesk</span>
      <span class="brand-tag">meeting talk → tracked tasks</span>
    </div>
    <div class="topbar-actions">
      <span id="modeBadge" class="mode-badge" title="Extraction mode"></span>
      <button id="standupBtn" class="btn btn-secondary" type="button">Standup</button>
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.31.06-.62.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.62l-1.92-3.32a.49.49 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.4h-3.84a.48.48 0 0 0-.48.4l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.49.49 0 0 0-.6.22L2.71 8.86a.48.48 0 0 0 .12.62l2.03 1.58c-.04.31-.07.63-.07.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.62l1.92 3.32c.12.22.37.3.6.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.25.4.48.4h3.84c.24 0 .44-.16.48-.4l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.48 0 .6-.22l1.92-3.32a.49.49 0 0 0-.12-.62l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="chat-panel" aria-label="Chat">
      <div id="chatLog" class="chat-log" role="log" aria-live="polite"></div>
      <form id="chatForm" class="composer" autocomplete="off">
        <label for="chatInput" class="sr-only">Message</label>
        <textarea id="chatInput" rows="3" placeholder="Paste meeting notes or type “Rahul asked me to send the pricing deck by Friday”…  (Enter to send, Shift+Enter for a new line)"></textarea>
        <button id="sendBtn" class="btn btn-primary" type="submit">Send</button>
      </form>
    </section>

    <section class="board-panel" aria-label="Task board">
      <div class="summary-strip" id="summary">
        <div class="stat"><span class="stat-num" id="statOpen">0</span><span class="stat-label">Open</span></div>
        <div class="stat stat-today"><span class="stat-num" id="statToday">0</span><span class="stat-label">Due Today</span></div>
        <div class="stat stat-done"><span class="stat-num" id="statDone">0</span><span class="stat-label">Completed</span></div>
      </div>
      <div class="board" id="board">
        <div class="column" data-status="To Do">
          <div class="column-head"><h2>To Do</h2><span class="count" data-count="To Do">0</span></div>
          <div class="column-body" data-drop="To Do"></div>
        </div>
        <div class="column" data-status="In Progress">
          <div class="column-head"><h2>In Progress</h2><span class="count" data-count="In Progress">0</span></div>
          <div class="column-body" data-drop="In Progress"></div>
        </div>
        <div class="column" data-status="Done">
          <div class="column-head"><h2>Done</h2><span class="count" data-count="Done">0</span></div>
          <div class="column-body" data-drop="Done"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="settingsModal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-head">
        <h2 id="settingsTitle">Settings</h2>
        <button class="icon-btn" type="button" data-close aria-label="Close settings">✕</button>
      </div>
      <form id="settingsForm">
        <label class="field">
          <span>Gemini API key</span>
          <input id="apiKeyInput" type="password" placeholder="Paste your key (AIza…)" autocomplete="off" spellcheck="false">
          <small>Saved only in this browser's localStorage and sent only to generativelanguage.googleapis.com. Leave empty to use the built-in rule-based parser.</small>
        </label>
        <label class="field">
          <span>Model</span>
          <input id="modelInput" type="text" spellcheck="false" placeholder="gemini-2.0-flash">
          <small>Default: gemini-2.0-flash. Change it if Google retires that model for your key.</small>
        </label>
        <div class="modal-actions">
          <button type="button" id="clearKeyBtn" class="btn btn-ghost">Remove key</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
      <div class="danger-zone">
        <h3>Data</h3>
        <div class="modal-actions left">
          <button type="button" id="clearChatBtn" class="btn btn-ghost">Clear chat</button>
          <button type="button" id="resetDataBtn" class="btn btn-danger">Reset to demo data</button>
        </div>
        <small id="storageNote"></small>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
